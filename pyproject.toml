[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["build", "tests/reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Frozen-oracle tests add their import roots first.
"tests/test_data_features.py" = ["E402"]
"tests/test_parity.py" = ["E402"]
